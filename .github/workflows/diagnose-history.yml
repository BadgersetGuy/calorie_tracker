name: Diagnose history requests privately
on:
  push:
    branches: [codex/android-meal-tracker]
    paths: [.github/workflows/diagnose-history.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MOBILE_API_TOKEN: ${{ secrets.MOBILE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: '0.5.6'
      - run: python scripts/diagnose_history.py
