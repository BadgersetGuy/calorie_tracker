name: Keep the existing Fly server warm
on:
  push:
    branches: [codex/android-meal-tracker]
    paths: [.github/workflows/keep-fly-warm.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calorie-tracker-production-deployment
  cancel-in-progress: false
jobs:
  warm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: '0.5.6'
      - run: pip install tomli-w==1.2.0
      - run: python scripts/keep_fly_warm.py
